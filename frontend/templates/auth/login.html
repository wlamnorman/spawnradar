{% extends "base.html" %}

{% block title %}Sign In — SpawnRadar{% endblock %}

{% block content %}
<div class="auth-card">
  <h1 class="auth-title">Sign in to SpawnRadar</h1>
  <p class="auth-subtitle">The indie dev prospecting tool.</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login" class="auth-form">
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      <a href="/auth/forgot-password" style="font-size:13px;color:#6366f1;float:right;margin-top:4px;">Forgot password?</a>
    </div>
    <button type="submit" class="button button-full" style="clear:both;">Sign in</button>
  </form>

  <p class="auth-switch">
    No account? <a href="/auth/register">Create one — it's free</a>
  </p>
</div>
{% endblock %}

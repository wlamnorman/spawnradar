{% extends "base.html" %}

{% block title %}Create Account — SpawnRadar{% endblock %}

{% block content %}
<div class="auth-card">
  <h1 class="auth-title">Create your account</h1>
  <p class="auth-subtitle">Start prospecting for your indie game today.</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/register" class="auth-form">
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Choose a strong password">
    </div>
    <button type="submit" class="button button-full">Create account</button>
  </form>

  <p class="auth-switch">
    Already have an account? <a href="/auth/login">Sign in</a>
  </p>
</div>
{% endblock %}

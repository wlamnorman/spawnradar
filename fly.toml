app = "spawnradar"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/spawnradar.sqlite3"

[[mounts]]
  source = "spawnradar_data"
  destination = "/data"
  # When the volume reaches 80% full, Fly is allowed to grow it.
  auto_extend_size_threshold = 80
  # Each time it grows, it adds 1 GB.
  auto_extend_size_increment = "1GB"
  # It will keep auto-growing only until the volume reaches 5 GB total.
  auto_extend_size_limit = "5GB"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 1

  # https://fly.io/docs/launch/autostop-autostart/
  auto_stop_machines = "off"
  auto_start_machines = true

  [[http_service.checks]]
    grace_period = "15s"
    interval = "10s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

app = 'spawnradar'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/spawnradar.sqlite3'
  WEB_CONCURRENCY = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[metrics]
  port = 8000
  path = '/metrics'

[[vm]]
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = 'spawnradar_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '20GB'

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Smaller Twitch streamer size bins have a higher live-viewer-to-follower ratio</title>
<desc id="desc">Bar chart showing live viewers divided by followers across six Twitch follower bins: under 15K, 15K to 50K, 50K to 100K, 100K to 500K, 500K to 1M and 1M+.</desc>
<rect width="960" height="640" fill="#ffffff"/>
<text x="110" y="46" font-size="28" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">Smaller streames have a higher live-viewer ratio</text>
<line x1="110" y1="552.0" x2="942" y2="552.0" stroke="#e7edf5" stroke-width="1"/>
<text x="96" y="558.0" text-anchor="end" font-size="18" font-family="Inter, Arial, sans-serif" fill="#5f6c7b">0%</text>
<line x1="110" y1="467.3" x2="942" y2="467.3" stroke="#e7edf5" stroke-width="1"/>
<text x="96" y="473.3" text-anchor="end" font-size="18" font-family="Inter, Arial, sans-serif" fill="#5f6c7b">0.3%</text>
<line x1="110" y1="382.6" x2="942" y2="382.6" stroke="#e7edf5" stroke-width="1"/>
<text x="96" y="388.6" text-anchor="end" font-size="18" font-family="Inter, Arial, sans-serif" fill="#5f6c7b">0.6%</text>
<line x1="110" y1="297.9" x2="942" y2="297.9" stroke="#e7edf5" stroke-width="1"/>
<text x="96" y="303.9" text-anchor="end" font-size="18" font-family="Inter, Arial, sans-serif" fill="#5f6c7b">0.9%</text>
<line x1="110" y1="213.2" x2="942" y2="213.2" stroke="#e7edf5" stroke-width="1"/>
<text x="96" y="219.2" text-anchor="end" font-size="18" font-family="Inter, Arial, sans-serif" fill="#5f6c7b">1.2%</text>
<line x1="110" y1="128.5" x2="942" y2="128.5" stroke="#e7edf5" stroke-width="1"/>
<text x="96" y="134.5" text-anchor="end" font-size="18" font-family="Inter, Arial, sans-serif" fill="#5f6c7b">1.5%</text>
<line x1="110" y1="552" x2="942" y2="552" stroke="#ccd6e3" stroke-width="1.5"/>
<line x1="110" y1="72" x2="110" y2="552" stroke="#ccd6e3" stroke-width="1.5"/>
<text x="36" y="312" text-anchor="middle" font-size="20" font-weight="600" font-family="Inter, Arial, sans-serif" fill="#243b53" transform="rotate(-90 36 312)">Live viewers / followers</text>
<text x="526" y="624" text-anchor="middle" font-size="20" font-family="Inter, Arial, sans-serif" fill="#243b53">Twitch follower bin</text>
<rect x="110.0" y="120.0" width="108" height="432.0" rx="14" fill="#6177ea" opacity="0.9"/>
<text x="164.0" y="108.0" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">1.53%</text>
<text x="164.0" y="580" text-anchor="middle" font-size="18" font-family="Inter, Arial, sans-serif" fill="#243b53">&lt;15K</text>
<rect x="254.8" y="331.8" width="108" height="220.2" rx="14" fill="#6177ea" opacity="0.9"/>
<text x="308.8" y="319.8" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">0.78%</text>
<text x="308.8" y="580" text-anchor="middle" font-size="18" font-family="Inter, Arial, sans-serif" fill="#243b53">15K-50K</text>
<rect x="399.6" y="416.5" width="108" height="135.5" rx="14" fill="#6177ea" opacity="0.9"/>
<text x="453.6" y="404.5" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">0.48%</text>
<text x="453.6" y="580" text-anchor="middle" font-size="18" font-family="Inter, Arial, sans-serif" fill="#243b53">50K-100K</text>
<rect x="544.4" y="461.6" width="108" height="90.4" rx="14" fill="#6177ea" opacity="0.9"/>
<text x="598.4" y="449.6" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">0.32%</text>
<text x="598.4" y="580" text-anchor="middle" font-size="18" font-family="Inter, Arial, sans-serif" fill="#243b53">100K-500K</text>
<rect x="689.2" y="489.9" width="108" height="62.1" rx="14" fill="#6177ea" opacity="0.9"/>
<text x="743.2" y="477.9" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">0.22%</text>
<text x="743.2" y="580" text-anchor="middle" font-size="18" font-family="Inter, Arial, sans-serif" fill="#243b53">500K-1M</text>
<rect x="834.0" y="481.4" width="108" height="70.6" rx="14" fill="#6177ea" opacity="0.9"/>
<text x="888.0" y="469.4" text-anchor="middle" font-size="20" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#243b53">0.25%</text>
<text x="888.0" y="580" text-anchor="middle" font-size="18" font-family="Inter, Arial, sans-serif" fill="#243b53">1M+</text>
</svg>

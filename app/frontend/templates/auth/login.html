{% extends "base.html" %}

{% block title %}Sign In — SpawnRadar{% endblock %}

{% block content %}
<div class="auth-card">
  <h1 class="auth-title">Sign in to SpawnRadar</h1>
  <p class="auth-subtitle">The indie dev prospecting tool.</p>

  <a href="/auth/google" class="button button-full button-google">
    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex-shrink:0">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z"/>
    </svg>
    Continue with Google
  </a>

  <div class="auth-divider"><span>or</span></div>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token_for(request) }}">
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      <a href="/auth/forgot-password" style="font-size:13px;color:#6366f1;float:right;margin-top:4px;">Forgot password?</a>
    </div>
    <button type="submit" class="button button-full" style="clear:both;">Sign in</button>
  </form>

  <p class="auth-switch">
    No account? <a href="/auth/register">Create one — it's free</a>
  </p>
</div>
{% endblock %}

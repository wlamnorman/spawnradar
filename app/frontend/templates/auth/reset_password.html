{% extends "base.html" %}

{% block title %}Reset Password — SpawnRadar{% endblock %}

{% block content %}
<div class="auth-card">
  <h1 class="auth-title">Choose a new password</h1>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/reset-password" class="auth-form" id="reset-form">
    <input type="hidden" name="token" value="{{ token }}">

    <div class="form-group">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" required
             autocomplete="new-password" placeholder="••••••••">
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" required
             autocomplete="new-password" placeholder="••••••••">
      <span id="pw-mismatch" style="display:none;color:#ef4444;font-size:13px;margin-top:4px;">
        Passwords do not match.
      </span>
    </div>

    <button type="submit" class="button button-full">Set new password</button>
  </form>

  <p class="auth-switch">
    <a href="/auth/login">Back to sign in</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var form = document.getElementById('reset-form');
    var pw = document.getElementById('new_password');
    var confirm = document.getElementById('confirm_password');
    var msg = document.getElementById('pw-mismatch');

    function validate() {
      if (confirm.value && pw.value !== confirm.value) {
        msg.style.display = 'block';
        return false;
      }
      msg.style.display = 'none';
      return true;
    }

    confirm.addEventListener('input', validate);
    pw.addEventListener('input', validate);

    form.addEventListener('submit', function (e) {
      if (!validate()) {
        e.preventDefault();
      }
    });
  })();
</script>
{% endblock %}
